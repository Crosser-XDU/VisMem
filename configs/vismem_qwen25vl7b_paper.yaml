# Parameters that are closer to the VisMem paper appendix table.
model:
  model_name_or_path: "Qwen/Qwen2.5-VL-7B-Instruct"
  torch_dtype: "bfloat16"
  device_map: "auto"
  trust_remote_code: true

vismem:
  short_invoke_token: "<ms_I>"
  short_end_token: "<ms_E>"
  long_invoke_token: "<ml_I>"
  long_end_token: "<ml_E>"

  query_len: 8
  short_mem_len: 4
  long_mem_len: 8

  query_builder:
    num_layers: 2
    num_heads: 8
    dropout: 0.0
    ff_mult: 4

  former_backend: "lora_llm"

  lora:
    r: 16
    alpha: 32
    dropout: 0.1
    target_modules: ["q_proj", "v_proj"]

training:
  seed: 1234
  max_new_tokens: 256
  lr: 5.0e-5
  stage2_lr: 1.0e-5
  stage2_weight_decay: 0.0
  batch_size: 1
  grad_accum: 1
  stage1_memory_type: "random"
  stage1_force_position: "random"
  group_size: 16
  stage1_temperature: 0.7
  stage1_top_p: 0.9
  stage2_temperature: 0.7
  stage2_top_p: 0.9
  clip_ratio: 0.2
  kl_beta: 0.03
  stage1_kl_beta: 0.015
  penalty_alpha: 0.3
  paper_policy_epochs: 2
  paper_aligned: true
