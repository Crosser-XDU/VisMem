# Qwen3-VL 8B config for the local 8-GPU server.
model:
  model_name_or_path: "/mnt/llmshared-ssd-hd/wangruitao/Models/Qwen/Qwen3-VL-8B-Instruct"
  torch_dtype: "bfloat16"
  device_map: "auto"
  trust_remote_code: true
  local_files_only: true

vismem:
  short_invoke_token: "<ms_I>"
  short_end_token: "<ms_E>"
  long_invoke_token: "<ml_I>"
  long_end_token: "<ml_E>"

  query_len: 8
  short_mem_len: 8
  long_mem_len: 16

  query_builder:
    num_layers: 2
    num_heads: 8
    dropout: 0.0
    ff_mult: 4

  former_backend: "lora_llm"

  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

training:
  seed: 1234
  max_new_tokens: 256
  lr: 2.0e-4
  stage2_lr: 1.0e-5
  stage2_weight_decay: 0.0
  batch_size: 1
  grad_accum: 4
  stage1_memory_type: "short"
  group_size: 4
  stage2_temperature: 0.7
  stage2_top_p: 0.9
  kl_beta: 0.02
  paper_aligned: false
